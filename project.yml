name: ExternalBrowser
options:
  bundleIdPrefix: com.ipaddisplay
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
    # Manual (not Automatic) signing style so xcodebuild never tries to
    # resolve a development team — this repo builds fully unsigned;
    # AltServer/AltStore does the actual code-signing at install time.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  ExternalBrowser:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ExternalBrowser
    info:
      path: ExternalBrowser/Info.plist
      properties:
        CFBundleDisplayName: External Browser
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipaddisplay.ExternalBrowser
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
